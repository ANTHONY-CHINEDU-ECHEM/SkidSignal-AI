[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skidsignal"
version = "1.0.0"
description = "Emerging antilock brake defect surveillance with retrieval augmented analyst briefs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26", "pandas>=2.1", "pyarrow>=14", "scipy>=1.11", "scikit-learn>=1.4", "joblib>=1.3",
    "pyyaml>=6", "requests>=2.31", "matplotlib>=3.8", "fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
transformers = ["sentence-transformers>=2.6"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
skidsignal = "skidsignal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
